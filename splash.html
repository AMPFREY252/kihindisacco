<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KIHINDI SACCO – Welcome</title>
  <style>
    *, *::before, *::after { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }

    :root {
      --green-900: #0a3d2e;
      --green-800: #0d6e4f;
      --green-700: #12875f;
      --gold: #c9a227;
      --font: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

    html { 
      font-size: 16px; 
      -webkit-text-size-adjust: 100%; 
    }

    body {
      font-family: var(--font);
      background: linear-gradient(135deg, rgba(10, 61, 46, 0.85) 0%, rgba(13, 110, 79, 0.85) 45%, rgba(15, 92, 66, 0.85) 100%), 
                  url('../assets/logo/bg.jfif') center/cover no-repeat;
      color: #fff;
      line-height: 1.5;
      min-height: 100vh;
      overflow: hidden;
      display: grid;
      place-items: center;
      padding: 1.5rem;
    }

    .splash-container {
      text-align: center;
      position: relative;
      z-index: 10;
      animation: fadeInScale 0.8s ease-out;
    }

    .splash-logo {
      margin-bottom: 2rem;
      animation: slideDown 0.8s ease-out;
    }

    .splash-logo img {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      object-fit: contain;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      animation: pulse 2s ease-in-out infinite;
    }

    .splash-content h1 {
      font-size: 2.5rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
      letter-spacing: -0.03em;
      animation: slideUp 0.8s ease-out 0.2s backwards;
    }

    .splash-content p {
      font-size: 1.1rem;
      color: var(--gold);
      font-style: italic;
      margin-bottom: 0.5rem;
      animation: slideUp 0.8s ease-out 0.4s backwards;
    }

    .splash-tagline {
      font-size: 0.95rem;
      opacity: 0.85;
      margin-top: 1.5rem;
      animation: slideUp 0.8s ease-out 0.6s backwards;
    }

    .loading-dots {
      margin-top: 2.5rem;
      animation: slideUp 0.8s ease-out 0.8s backwards;
    }

    .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--gold);
      margin: 0 6px;
      animation: bounce 1.4s infinite;
    }

    .dot:nth-child(1) {
      animation-delay: 0s;
    }

    .dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes fadeInScale {
      from {
        opacity: 0;
        transform: scale(0.9);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        filter: drop-shadow(0 20px 60px rgba(0, 0, 0, 0.3));
      }
      50% {
        transform: scale(1.05);
        filter: drop-shadow(0 20px 80px rgba(201, 162, 39, 0.3));
      }
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
        opacity: 1;
      }
      50% {
        transform: translateY(-15px);
        opacity: 0.7;
      }
    }

    /* Decorative circles */
    .decor-circle {
      position: absolute;
      border-radius: 50%;
      opacity: 0.1;
    }

    .circle-1 {
      width: 400px;
      height: 400px;
      background: var(--gold);
      top: -100px;
      right: -100px;
    }

    .circle-2 {
      width: 300px;
      height: 300px;
      background: var(--gold);
      bottom: -50px;
      left: -50px;
    }
  </style>
</head>
<body>
  <!-- Decorative circles -->
  <div class="decor-circle circle-1"></div>
  <div class="decor-circle circle-2"></div>

  <!-- Splash content -->
  <div class="splash-container">
    <div class="splash-logo">
      <img src="assets/logo/real%20logo.jpg" alt="KIHINDI SACCO logo" />
    </div>
    <div class="splash-content">
      <h1>KIHINDI SACCO</h1>
      <p>Faith in God leads to success</p>
      <p class="splash-tagline">Mbarara City Boda Boda Riders' SACCO</p>
    </div>
    <div class="loading-dots">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  </div>

  <script>
    // Auto-redirect to login page after 3 seconds
    setTimeout(() => {
      window.location.href = 'index.html';
    }, 3000);

    // Allow immediate redirect with spacebar or click
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        window.location.href = 'index.html';
      }
    });

    document.addEventListener('click', () => {
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
